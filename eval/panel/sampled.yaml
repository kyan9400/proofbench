# Votes from a blind rater panel.
#
# Five raters, each working alone, each shown exactly what the judge is shown -
# the customer's message, the rubric and the reply - under an opaque id and in a
# different order from every other rater. No case name, no effect log, no
# deterministic verdict, no earlier label, no judge verdict, no other rater.
#
# The raters are models, drawn from four different ones and all much larger than
# the judge being measured. They are not people, and agreement with this panel is
# not agreement with a person.
#
# votes and reasons are in rater order, 1 to 5. `proofbench panel` reads this
# file, reports how far the panel agreed with itself, and derives the labels.
meta:
  set: sampled
  artifact: eval/sampled/artifact.json
  raters: 5
  distinct_models: 4
  rater_kind: model
  blind_to:
  - case id
  - effect log
  - deterministic verdict
  - earlier labels
  - judge verdicts
  - other raters
  rule: pass or fail when at least 4 of 5 agree; otherwise contested and excluded
  rule_fixed_before_voting: true
