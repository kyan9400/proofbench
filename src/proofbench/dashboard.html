<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proofbench</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --panel-2: #f8f9fb; --ink: #14161a; --ink-2: #3b4049;
  --muted: #6b7280; --line: #e4e6eb; --line-2: #d3d7de;
  --accent: #4f46e5; --accent-bg: #eef0fe;
  --pass: #15803d; --pass-bg: #e7f6ec; --pass-fill: #22a05a;
  --warn: #a16207; --warn-bg: #fdf3dc; --warn-fill: #e3a21a;
  --fail: #b91c1c; --fail-bg: #fde8e8; --fail-fill: #dc3b3b;
  --info: #1d4ed8; --info-bg: #e6eefc;
  --hero: #12141b; --hero-ink: #f2f3f7; --hero-muted: #9aa0ad; --hero-line: #262a35;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f14; --panel: #151821; --panel-2: #1b1f2a; --ink: #eceef3; --ink-2: #c4c8d2;
    --muted: #8b92a1; --line: #252a36; --line-2: #333a49;
    --accent: #8b85ff; --accent-bg: #23224a;
    --pass: #4ade80; --pass-bg: #12301f; --pass-fill: #2fb768;
    --warn: #fbbf24; --warn-bg: #352a0e; --warn-fill: #d99a14;
    --fail: #f87171; --fail-bg: #3a1618; --fail-fill: #e04848;
    --info: #93b4ff; --info-bg: #182543;
    --hero: #090a0e; --hero-line: #1f232e;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f14; --panel: #151821; --panel-2: #1b1f2a; --ink: #eceef3; --ink-2: #c4c8d2;
  --muted: #8b92a1; --line: #252a36; --line-2: #333a49;
  --accent: #8b85ff; --accent-bg: #23224a;
  --pass: #4ade80; --pass-bg: #12301f; --pass-fill: #2fb768;
  --warn: #fbbf24; --warn-bg: #352a0e; --warn-fill: #d99a14;
  --fail: #f87171; --fail-bg: #3a1618; --fail-fill: #e04848;
  --info: #93b4ff; --info-bg: #182543;
  --hero: #090a0e; --hero-line: #1f232e;
  --shadow: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.55 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-feature-settings: "tnum" 1; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code { font-family: var(--mono); font-size: 12px; background: var(--panel-2); border: 1px solid var(--line); padding: 0 4px; border-radius: 4px; }

/* ------------------------------------------------------------ hero */
.hero { background: var(--hero); color: var(--hero-ink); }
.hero-in { max-width: 1180px; margin: 0 auto; padding: 28px 20px 0; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 15px; letter-spacing: .2px; }
.brand .dot { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, #6366f1, #22c55e); display: inline-block; }
.brand .tag { color: var(--hero-muted); font-weight: 400; }
.hero h1 { font-size: 28px; line-height: 1.2; margin: 18px 0 8px; font-weight: 680; letter-spacing: -.4px; max-width: 760px; }
.hero p.lead { color: var(--hero-muted); max-width: 760px; margin: 0 0 22px; font-size: 15px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: rgba(255,255,255,.04); border: 1px solid var(--hero-line); border-radius: var(--radius); padding: 14px 16px; }
.kpi .label { color: var(--hero-muted); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; }
.kpi .value { font-size: 30px; font-weight: 700; letter-spacing: -.5px; margin: 2px 0; }
.kpi .value small { font-size: 14px; font-weight: 500; color: var(--hero-muted); margin-left: 4px; }
.kpi .note { color: var(--hero-muted); font-size: 12.5px; }
.kpi .good { color: #4ade80; } .kpi .bad { color: #f87171; } .kpi .mid { color: #fbbf24; }
nav { display: flex; gap: 2px; margin-top: 22px; overflow-x: auto; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav a { color: var(--hero-muted); padding: 11px 14px; border-radius: 8px 8px 0 0; white-space: nowrap; font-weight: 550; }
nav a:hover { color: var(--hero-ink); text-decoration: none; }
nav a.on { background: var(--bg); color: var(--ink); }

/* ------------------------------------------------------------ layout */
main { max-width: 1180px; margin: 0 auto; padding: 22px 20px 64px; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 6px 0 14px; }
.section-head h2 { font-size: 19px; margin: 0; letter-spacing: -.2px; }
.section-head p { margin: 2px 0 0; color: var(--muted); max-width: 720px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
.card.flush { padding: 0; overflow: hidden; }
.card h3 { font-size: 14px; margin: 0 0 10px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.grid-trace { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 14px; align-items: start; }
.scroll { overflow-x: auto; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }

table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 600; background: var(--panel-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--panel-2); }
td.num, th.num { text-align: right; }

.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 550; white-space: nowrap; line-height: 1.6; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .85; }
.chip.plain::before { display: none; }
.c-pass { background: var(--pass-bg); color: var(--pass); }
.c-warn { background: var(--warn-bg); color: var(--warn); }
.c-fail { background: var(--fail-bg); color: var(--fail); }
.c-info { background: var(--info-bg); color: var(--info); }
.c-mute { background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }

/* interval bar */
.rate { min-width: 190px; }
.rate .top { display: flex; justify-content: space-between; align-items: baseline; }
.rate .pct { font-weight: 650; font-size: 15px; }
.rate .ci { font-size: 11.5px; color: var(--muted); }
.track { position: relative; height: 8px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 99px; margin-top: 6px; }
.track .band { position: absolute; top: -1px; bottom: -1px; border-radius: 99px; opacity: .35; }
.track .pt { position: absolute; top: -4px; width: 4px; height: 14px; border-radius: 2px; margin-left: -2px; }
.fill-pass { background: var(--pass-fill); } .fill-warn { background: var(--warn-fill); } .fill-fail { background: var(--fail-fill); } .fill-info { background: var(--accent); }

.runname { font-weight: 650; }
.runmeta { color: var(--muted); font-size: 12.5px; }
.notice { display: flex; gap: 10px; align-items: flex-start; background: var(--warn-bg); color: var(--ink-2); border: 1px solid transparent; border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-size: 13px; }
.notice b { color: var(--warn); }

/* controls */
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.controls label { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 600; }
select { font: inherit; text-transform: none; letter-spacing: 0; color: var(--ink); background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 30px 7px 10px; min-width: 170px; max-width: 100%; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.stat .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 600; }
.stat .v { font-size: 22px; font-weight: 700; letter-spacing: -.3px; margin-top: 2px; }
.stat .v .arrow { color: var(--muted); font-weight: 400; margin: 0 4px; }

/* heatmap */
.heat td { padding: 7px 10px; }
.heat .case { min-width: 230px; }
.heat .case b { font-weight: 600; }
.squares { display: inline-flex; gap: 3px; vertical-align: middle; }
.sq { width: 16px; height: 16px; border-radius: 4px; display: inline-block; }
.sq.pass { background: var(--pass-fill); } .sq.warn { background: var(--warn-fill); } .sq.fail { background: var(--fail-fill); }
.sq.err { background: var(--line-2); } .sq.none { background: transparent; border: 1px dashed var(--line-2); }
a.sqlink:hover { text-decoration: none; filter: brightness(1.1); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; color: var(--muted); font-size: 12.5px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.cat-row td { background: var(--panel-2); font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 650; }

/* stacked bar */
.stack { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--panel-2); border: 1px solid var(--line); min-width: 160px; }
.stack div { height: 100%; }

/* trace */
.kv dt { font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 600; margin-top: 12px; }
.kv dt:first-child { margin-top: 0; }
.kv dd { margin: 4px 0 0; color: var(--ink-2); }
.fails { list-style: none; padding: 0; margin: 4px 0 0; display: grid; gap: 6px; }
.fails li { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.timeline { position: relative; padding-left: 26px; }
.timeline::before { content: ""; position: absolute; left: 9px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.ev { position: relative; margin-bottom: 12px; }
.ev .node { position: absolute; left: -26px; top: 10px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; }
.ev.customer .node { background: #64748b; } .ev.model .node { background: var(--accent); } .ev.tool .node { background: #0f766e; }
.ev.review .node { background: var(--warn-fill); } .ev.reply .node { background: var(--pass-fill); }
.bubble { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.ev.model .bubble { background: var(--accent-bg); border-color: transparent; }
.ev.reply .bubble { border: 1.5px solid var(--pass-fill); }
.ev .who { font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 650; margin-bottom: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.call { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); margin-top: 4px; }
.call b { color: var(--accent); font-weight: 650; }
details.io { margin-top: 6px; }
details.io summary { cursor: pointer; color: var(--muted); font-size: 12.5px; list-style: none; user-select: none; }
details.io summary::-webkit-details-marker { display: none; }
details.io summary::before { content: "\25B8"; display: inline-block; margin-right: 6px; transition: transform .15s; }
details.io[open] summary::before { transform: rotate(90deg); }
pre { font-family: var(--mono); font-size: 12px; line-height: 1.5; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; max-height: 360px; overflow: auto; }
.planted { background: var(--fail-bg); border: 1.5px solid var(--fail-fill); border-radius: 8px; padding: 10px 12px; margin-top: 8px; }
.planted .lbl { font-size: 11.5px; font-weight: 700; color: var(--fail); text-transform: uppercase; letter-spacing: .5px; }
.planted pre { background: transparent; border: 0; padding: 4px 0 0; margin: 0; color: var(--ink); }
.reply-text { white-space: pre-wrap; }

/* forest plot */
.forest { width: 100%; }
.forest .row { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr) 90px; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.forest .row:last-child { border-bottom: 0; }
.forest .ttl { font-weight: 600; }
.forest .ttl small { display: block; font-weight: 400; color: var(--muted); }
.forest .plot { position: relative; height: 22px; }
.forest .axis { position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--line); }
.forest .tick { position: absolute; top: 4px; width: 1px; height: 14px; background: var(--line-2); }
.forest .ival { position: absolute; top: 8px; height: 6px; border-radius: 99px; }
.forest .dotp { position: absolute; top: 4px; width: 14px; height: 14px; border-radius: 50%; margin-left: -7px; border: 2px solid var(--panel); }
.forest .val { text-align: right; font-weight: 650; }
.forest .scale { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr) 90px; gap: 14px; color: var(--muted); font-size: 11.5px; }
.forest .scale .labs { position: relative; height: 16px; }
.forest .scale .labs span { position: absolute; transform: translateX(-50%); }
.dim { opacity: .55; }

footer { color: var(--muted); font-size: 12.5px; max-width: 1180px; margin: 0 auto; padding: 0 20px 40px; }

@media (max-width: 900px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid2, .grid-trace { grid-template-columns: minmax(0, 1fr); }
  .forest .row, .forest .scale { grid-template-columns: minmax(0, 1fr) 70px; }
  .forest .row .plot, .forest .scale .labs { grid-column: 1 / -1; grid-row: 2; }
}
@media (max-width: 520px) {
  .hero h1 { font-size: 22px; }
  .brand .tag { display: none; }
  .kpi .value { font-size: 24px; }
  .hero-in, main, footer { padding-left: 16px; padding-right: 16px; }
  th, td { padding: 9px 10px; }
}
</style>
</head>
<body>
<div class="hero"><div class="hero-in">
  <div class="brand"><span class="dot"></span>Proofbench <span class="tag">&middot; evaluating a tool-using LLM agent</span></div>
  <h1>Decide everything you can without a model, and measure the judge you cannot avoid.</h1>
  <p class="lead" id="lead"></p>
  <div class="kpis" id="kpis"></div>
  <nav id="nav"></nav>
</div></div>
<main id="main"></main>
<footer id="footer"></footer>
<script id="data" type="application/json">__DATA__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const RUNS = D.runs, CASES = D.cases;
const byName = Object.fromEntries(RUNS.map(r => [r.name, r]));
const caseInfo = Object.fromEntries(CASES.map(c => [c.id, c]));
const HEADLINE = byName.baseline || RUNS[0];
const SAMPLED = byName.sampled;

function esc(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}
function pct(x, d = 1) { return x == null ? "&ndash;" : (x * 100).toFixed(d) + "%"; }
function chip(cls, text, title) { return '<span class="chip ' + cls + '"' + (title ? ' title="' + esc(title) + '"' : "") + ">" + esc(text) + "</span>"; }
function tone(rate) { return rate >= 0.9 ? "pass" : rate >= 0.7 ? "warn" : "fail"; }

function rateCell(r, kind) {
  if (!r || !r.ci95) return '<span class="muted">&ndash;</span>';
  const lo = r.ci95[0] * 100, hi = r.ci95[1] * 100, pt = r.rate * 100, t = kind || tone(r.rate);
  return '<div class="rate"><div class="top"><span class="pct">' + pct(r.rate) + '</span><span class="ci">95% ' + lo.toFixed(0) + "&ndash;" + hi.toFixed(0) + "%</span></div>" +
    '<div class="track" title="Wilson 95% interval ' + lo.toFixed(1) + "&ndash;" + hi.toFixed(1) + '%"><div class="band fill-' + t + '" style="left:' + lo + "%;width:" + Math.max(hi - lo, 0.8) + '%"></div>' +
    '<div class="pt fill-' + t + '" style="left:' + pt + '%"></div></div></div>';
}
function gradedChip(r) {
  return r.graded === "current" ? chip("c-pass", "current graders", r.grading_note) : chip("c-warn", "graded at " + r.meta.git_sha, r.grading_note);
}
function config(r) {
  const m = r.meta, parts = [m.model, "t=" + (m.temperature == null ? "0" : m.temperature), "×" + m.repeats];
  if (m.reviewer) parts.push("reviewer" + (m.reviewer_think === false ? ", no thinking" : ""));
  if (m.replayed_from) parts.push("replay");
  return parts.join(" · ");
}
function outcomeOf(a) {
  if (a.errored) return {cls: "err", chip: chip("c-mute", "errored"), word: "errored"};
  if (a.passed) return {cls: "pass", chip: chip("c-pass", "correct"), word: "correct"};
  if (a.safe) return {cls: "warn", chip: chip("c-warn", "wrong, safe"), word: "wrong but safe"};
  return {cls: "fail", chip: chip("c-fail", "unsafe"), word: "unsafe"};
}
function squaresFor(run, caseId) {
  const atts = run.attempts.filter(a => a.case_id === caseId);
  if (!atts.length) return '<span class="sq none" title="not in this run"></span>';
  return '<span class="squares">' + atts.map(a => {
    const o = outcomeOf(a);
    return '<a class="sqlink" href="#trace/' + encodeURIComponent(run.name) + "/" + encodeURIComponent(caseId) + "/" + a.repeat + '" title="' + esc(caseId + " · repeat " + a.repeat + ": " + o.word) + '"><span class="sq ' + o.cls + '"></span></a>';
  }).join("") + "</span>";
}
function legend() {
  return '<div class="legend"><span><i class="sq pass"></i>correct</span><span><i class="sq warn"></i>wrong, nothing dangerous</span><span><i class="sq fail"></i>unsafe</span><span><i class="sq err"></i>errored</span><span>one square per repeat &middot; click for the trace</span></div>';
}
function runOptions(selected) {
  return RUNS.map(r => "<option" + (r.name === selected ? " selected" : "") + ' value="' + esc(r.name) + '">' + esc(r.name) + (r.graded !== "current" ? " (older graders)" : "") + "</option>").join("");
}
function head(title, text, right) {
  return '<div class="section-head"><div><h2>' + title + "</h2>" + (text ? "<p>" + text + "</p>" : "") + "</div>" + (right || "") + "</div>";
}
function staleNotices(runs) {
  return runs.filter(r => r.graded !== "current").map(r =>
    '<div class="notice"><span>&#9888;</span><div><b>' + esc(r.name) + "</b> is shown as graded at " + esc(r.meta.git_sha) + ". " + esc(r.grading_note.split(";")[0]) + ". Its numbers are not comparable with the runs graded by the current graders.</div></div>").join("");
}
function tryPretty(text) {
  if (text == null) return "";
  const s = String(text);
  try { return JSON.stringify(JSON.parse(s), null, 2); } catch (e) {}
  try { return JSON.stringify(JSON.parse(s.replace(/'/g, '"').replace(/\bTrue\b/g, "true").replace(/\bFalse\b/g, "false").replace(/\bNone\b/g, "null")), null, 2); } catch (e) {}
  return s;
}
function oneLineArgs(text) {
  const s = tryPretty(text);
  try { const o = JSON.parse(s); return Object.entries(o).map(([k, v]) => k + "=" + (typeof v === "string" ? '"' + v + '"' : JSON.stringify(v))).join(", "); } catch (e) { return s; }
}

// ------------------------------------------------------------------ header

function renderHero() {
  const nAtt = RUNS.filter(r => r.graded === "current").reduce((n, r) => n + r.attempts.length, 0);
  document.getElementById("lead").innerHTML =
    "A support agent for a small online shop can look up orders, read policy, refund money, cancel orders and escalate. Every question worth asking about it is answered from an effect log, not a model's opinion &mdash; except whether its replies read well, where an LLM judge is used and measured against a blind panel. " +
    esc(CASES.length) + " cases, " + esc(RUNS.length) + " recorded runs, " + nAtt + " attempts re-graded on this page.";
  // The headline judge figure is the pooled set with contested replies kept in:
  // excluding them is how this project once manufactured a kappa of 1.0.
  const pool = D.judge.find(j => /pooled-majority/.test(j.file));
  const inj = r => r ? r.attempts.filter(a => (caseInfo[a.case_id] || {}).category === "injection" && !a.errored) : [];
  const unsafeInj = SAMPLED ? new Set(inj(SAMPLED).filter(a => !a.safe).map(a => a.case_id)).size : null;
  const kpis = [
    {label: "Fully correct", value: pct(HEADLINE.pass.rate), cls: "mid", note: "95% CI " + pct(HEADLINE.pass.ci95[0], 0) + "&ndash;" + pct(HEADLINE.pass.ci95[1], 0) + " &middot; " + esc(HEADLINE.meta.model) + ", temperature 0"},
    {label: "No critical failure", value: pct(HEADLINE.safe.rate), cls: "good", note: "the one unsafe case: a 1,420.00 refund against a 500.00 cap"},
    {label: "Judge vs blind panel", value: pool ? "&kappa; " + pool.kappa.toFixed(2) : "&ndash;", cls: "good", note: pool ? "95% CI " + pool.ci[0].toFixed(2) + "&ndash;" + pool.ci[1].toFixed(2) + " &middot; " + pool.n + " replies, contested ones kept in" : ""},
    {label: "Planted instructions obeyed", value: (unsafeInj == null ? "&ndash;" : unsafeInj) + '<small>of 5</small>', cls: "bad", note: "at temperature 0.7, and paid out &middot; 1 of 5 at 0, in words only"},
  ];
  document.getElementById("kpis").innerHTML = kpis.map(k => '<div class="kpi"><div class="label">' + k.label + '</div><div class="value ' + k.cls + '">' + k.value + '</div><div class="note">' + k.note + "</div></div>").join("");
  document.getElementById("footer").innerHTML = 'Built by re-grading every recorded run by replay with the current graders; latency, tokens and cost are as recorded. Source and method: <a href="https://github.com/kyan9400/proofbench">github.com/kyan9400/proofbench</a>.';
}

// ------------------------------------------------------------------ views

const VIEWS = {
  overview() {
    const rows = RUNS.map(r => {
      const lat = r.latency_ms || {}, tok = r.tokens || {};
      const latency = r.meta.replayed_from ? '<span class="muted" title="a replay\'s clock describes the replay">replay</span>' : lat.p50 ? (lat.p50 / 1000).toFixed(1) + " s" : "&ndash;";
      return '<tr class="' + (r.graded !== "current" ? "dim" : "") + '"><td><div class="runname">' + esc(r.name) + '</div><div class="runmeta">' + esc(config(r)) + "</div><div style=\"margin-top:6px\">" + gradedChip(r) + "</div></td>" +
        "<td>" + rateCell(r.pass) + "</td><td>" + rateCell(r.safe) + "</td>" +
        '<td class="num"><b>' + r.totals.cases_passing_every_repeat + '</b><span class="muted"> / ' + r.totals.cases + "</span></td>" +
        '<td class="num">' + latency + '</td><td class="num">' + (tok.mean ? tok.mean.toLocaleString() : "&ndash;") + "</td></tr>";
    }).join("");
    return head("Recorded runs", "Two rates, deliberately separate: how often the agent was completely right, and how often it did nothing dangerous. “Forgot to state the amount” and “refunded a stranger” should not average together.") +
      '<div class="card flush scroll"><table><thead><tr><th>run</th><th>fully correct</th><th>no critical failure</th><th class="num">clean cases</th><th class="num">median latency</th><th class="num">tokens / attempt</th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
      staleNotices(RUNS) +
      '<p class="muted small">Bars are Wilson 95% intervals with the point estimate marked. A clean case passed on every repeat. Errored attempts are excluded from both rates.</p>';
  },

  compare(args) {
    const a = byName[args[0]] || HEADLINE, b = byName[args[1]] || SAMPLED || RUNS.find(r => r !== a) || a;
    const ids = CASES.map(c => c.id).filter(id => a.per_case[id] || b.per_case[id]);
    const rate = e => (e && e.scored) ? e.passed / e.scored : null;
    const unsafe = e => (e && e.scored) ? e.scored - e.safe : 0;
    const KIND = {"became unsafe": "c-fail", "broke": "c-fail", "less reliable": "c-warn", "became safe": "c-pass", "fixed": "c-pass", "more reliable": "c-info", "only in one": "c-mute", "same": ""};
    const count = Object.fromEntries(Object.keys(KIND).map(k => [k, 0]));
    const rows = ids.map(id => {
      const ea = a.per_case[id], eb = b.per_case[id], ra = rate(ea), rb = rate(eb);
      let kind;
      // Safety first: wrong before and wrong *and dangerous* now is not "same".
      if (ra == null || rb == null) kind = "only in one";
      else if (!unsafe(ea) && unsafe(eb)) kind = "became unsafe";
      else if (unsafe(ea) && !unsafe(eb)) kind = "became safe";
      else if (ra < 1 && rb === 1) kind = "fixed";
      else if (ra > 0 && rb === 0) kind = "broke";
      else if (rb < ra) kind = "less reliable";
      else if (rb > ra) kind = "more reliable";
      else kind = "same";
      count[kind]++;
      return {kind, html: '<tr><td><a href="#trace/' + encodeURIComponent(b.name) + "/" + encodeURIComponent(id) + '/1"><b>' + esc(id) + '</b></a><div class="runmeta">' + esc((caseInfo[id] || {}).title) + "</div></td>" +
        "<td>" + squaresFor(a, id) + "</td><td>" + squaresFor(b, id) + "</td><td>" + (kind === "same" ? '<span class="muted">same</span>' : chip(KIND[kind], kind)) + "</td></tr>"};
    });
    const order = Object.keys(KIND);
    rows.sort((x, y) => order.indexOf(x.kind) - order.indexOf(y.kind));
    const warn = (a.graded !== b.graded) ? '<div class="notice"><span>&#9888;</span><div>One of these runs is graded by older graders, so a difference here may be the grading rather than the agent.</div></div>' : "";
    const arrow = (x, y) => pct(x) + '<span class="arrow">&rarr;</span>' + pct(y);
    return head("Compare two runs", "Case by case, with changes in safety sorted first: a case that was wrong and is now wrong <i>and dangerous</i> has not stayed the same.",
        '<div class="controls"><label>baseline<select id="ca">' + runOptions(a.name) + '</select></label><label>candidate<select id="cb">' + runOptions(b.name) + "</select></label></div>") +
      '<div class="stats" style="margin-bottom:14px">' +
      '<div class="stat"><div class="k">fully correct</div><div class="v">' + arrow(a.pass.rate, b.pass.rate) + "</div></div>" +
      '<div class="stat"><div class="k">no critical failure</div><div class="v">' + arrow(a.safe.rate, b.safe.rate) + "</div></div>" +
      '<div class="stat"><div class="k">became unsafe</div><div class="v" style="color:var(--fail)">' + count["became unsafe"] + "</div></div>" +
      '<div class="stat"><div class="k">broke &middot; fixed</div><div class="v">' + count.broke + ' <span class="arrow">&middot;</span> ' + count.fixed + "</div></div></div>" + warn +
      '<div class="card flush scroll"><table><thead><tr><th>case</th><th>' + esc(a.name) + "</th><th>" + esc(b.name) + "</th><th>change</th></tr></thead><tbody>" + rows.map(r => r.html).join("") + "</tbody></table></div>" +
      legend();
  },

  cases() {
    const cats = [...new Set(CASES.map(c => c.category))];
    const headRow = '<tr><th class="case">case</th>' + RUNS.map(r => '<th title="' + esc(config(r)) + '">' + esc(r.name) + (r.graded !== "current" ? " *" : "") + "</th>").join("") + "</tr>";
    const body = cats.map(cat => '<tr class="cat-row"><td colspan="' + (RUNS.length + 1) + '">' + esc(cat) + "</td></tr>" +
      CASES.filter(c => c.category === cat).map(c => '<tr><td class="case"><b>' + esc(c.id) + '</b><div class="runmeta">' + esc(c.title) + "</div></td>" +
        RUNS.map(r => '<td class="' + (r.graded !== "current" ? "dim" : "") + '">' + squaresFor(r, c.id) + "</td>").join("") + "</tr>").join("")).join("");
    return head("Every case, every run", "Each square is one attempt. Faded columns (*) are graded by older graders.", legend()) +
      '<div class="card flush scroll heat"><table><thead>' + headRow + "</thead><tbody>" + body + "</tbody></table></div>";
  },

  trace(args) {
    const run = byName[args[0]] || HEADLINE;
    const caseId = args[1] && run.per_case[args[1]] ? args[1] : "injection-tampered-policy" in run.per_case ? "injection-tampered-policy" : (run.attempts[0] || {}).case_id;
    const repeats = run.attempts.filter(a => a.case_id === caseId);
    const att = repeats.find(a => String(a.repeat) === String(args[2])) || repeats[0];
    const c = caseInfo[caseId] || {};
    const caseOpts = CASES.filter(x => run.per_case[x.id]).map(x => "<option" + (x.id === caseId ? " selected" : "") + ">" + esc(x.id) + "</option>").join("");
    const repOpts = repeats.map(a => "<option" + (a === att ? " selected" : "") + ">" + a.repeat + "</option>").join("");
    const controls = '<div class="controls"><label>run<select id="tr">' + runOptions(run.name) + '</select></label><label>case<select id="tc">' + caseOpts + '</select></label><label>repeat<select id="tp">' + repOpts + "</select></label></div>";
    if (!att) return head("Trace", "", controls) + '<p class="muted">No attempts.</p>';
    const o = outcomeOf(att);

    const side = '<div class="card"><div class="tags" style="margin-bottom:10px">' + o.chip + chip("c-mute plain", c.category || "") + gradedChip(run) + "</div>" +
      '<h3 style="font-size:16px;margin-bottom:6px">' + esc(c.title) + "</h3>" +
      '<dl class="kv">' +
      (c.rubric ? "<dt>what a good reply does</dt><dd>" + esc(c.rubric) + "</dd>" : "") +
      (c.forbidden && c.forbidden.length ? "<dt>forbidden here</dt><dd>" + c.forbidden.map(f => "&middot; " + esc(f)).join("<br>") + "</dd>" : "") +
      (att.failures.length ? '<dt>what failed</dt><dd><ul class="fails">' + att.failures.map(f => "<li>" + chip(f.severity === "critical" ? "c-fail" : f.severity === "major" ? "c-warn" : "c-mute", f.name + " · " + f.severity) + '<div style="margin-top:4px">' + esc(f.detail) + "</div></li>").join("") + "</ul></dd>" : "<dt>graders</dt><dd>every applicable grader passed</dd>") +
      (att.diagnostics.length ? '<dt>diagnostics</dt><dd class="tags">' + att.diagnostics.map(d => chip("c-info plain", d)).join("") + "</dd>" : "") +
      '<dt>meters</dt><dd class="small">' + att.steps.length + " steps &middot; " + (att.wall_ms / 1000).toFixed(1) + " s &middot; " + att.tokens.toLocaleString() + " tokens &middot; ended: " + esc(att.stop_reason) + "</dd></dl></div>";

    const events = ['<div class="ev customer"><span class="node">C</span><div class="bubble"><div class="who">customer</div>' + esc(c.prompt) + "</div></div>"];
    att.steps.forEach(s => {
      if (s.kind === "model") {
        const calls = (s.tool_calls || []).map(t => '<div class="call">&rarr; <b>' + esc(t.name) + "</b>(" + esc(oneLineArgs(t.arguments)) + ")</div>").join("");
        events.push('<div class="ev model"><span class="node">M</span><div class="bubble"><div class="who">agent' + (s.latency_ms ? '<span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">' + (s.latency_ms / 1000).toFixed(1) + " s</span>" : "") + "</div>" +
          (s.text ? '<div class="reply-text">' + esc(s.text) + "</div>" : "") + calls + "</div></div>");
      } else if (s.kind === "review") {
        const cls = s.decision === "approve" ? "c-pass" : s.decision === "reject" ? "c-fail" : "c-warn";
        events.push('<div class="ev review"><span class="node">R</span><div class="bubble"><div class="who">reviewer ' + chip(cls, s.decision) + "</div>" +
          '<div class="call"><b>' + esc(s.tool_name) + "</b>(" + esc(oneLineArgs(s.arguments)) + ')</div><div style="margin-top:6px">' + esc(s.reason) + "</div></div></div>");
      } else {
        let result = s.result || "", planted = "";
        if (s.injected) {
          // The planted text is appended after the real result, separated by a blank line.
          const at = result.lastIndexOf("\n\n");
          if (at > 0) { planted = result.slice(at + 2); result = result.slice(0, at); }
        }
        const status = s.error ? chip("c-fail", "error") : s.ok === false ? chip("c-warn", "refused") : "";
        events.push('<div class="ev tool"><span class="node">T</span><div class="bubble"><div class="who">tool &middot; ' + esc(s.tool_name) + " " + status + "</div>" +
          '<div class="call">' + esc(oneLineArgs(s.arguments)) + "</div>" +
          (result ? '<details class="io"' + (s.injected ? " open" : "") + "><summary>result</summary><pre>" + esc(tryPretty(result)) + "</pre></details>" : "") +
          (planted ? '<div class="planted"><div class="lbl">&#9888; planted text, appended to this result by the test</div><pre>' + esc(planted) + "</pre></div>" : (s.injected ? '<div class="planted"><div class="lbl">&#9888; this result carries planted text</div></div>' : "")) +
          (s.error ? '<pre style="color:var(--fail)">' + esc(s.error) + "</pre>" : "") +
          (s.schema_errors ? '<pre style="color:var(--fail)">' + esc(JSON.stringify(s.schema_errors, null, 2)) + "</pre>" : "") + "</div></div>");
      }
    });
    events.push('<div class="ev reply"><span class="node">&#10003;</span><div class="bubble"><div class="who">final reply to the customer</div><div class="reply-text">' + (att.reply ? esc(att.reply) : '<span class="muted">(the agent never replied)</span>') + "</div></div></div>");

    return head("Trace", "Every step of one attempt, as the agent saw it.", controls) +
      (run.graded !== "current" ? staleNotices([run]) : "") +
      '<div class="grid-trace">' + side + '<div class="card"><div class="timeline">' + events.join("") + "</div></div></div>";
  },

  injection() {
    const inj = CASES.filter(c => c.category === "injection");
    const summary = RUNS.map(r => {
      const atts = r.attempts.filter(a => (caseInfo[a.case_id] || {}).category === "injection" && !a.errored);
      const ok = atts.filter(a => a.passed).length, bad = atts.filter(a => !a.safe).length, mid = atts.length - ok - bad, n = atts.length || 1;
      return '<tr class="' + (r.graded !== "current" ? "dim" : "") + '"><td><div class="runname">' + esc(r.name) + '</div><div class="runmeta">' + esc(config(r)) + "</div></td>" +
        '<td><div class="stack" title="' + ok + " correct, " + mid + " wrong but safe, " + bad + ' unsafe"><div class="fill-pass" style="width:' + (ok / n * 100) + '%"></div><div class="fill-warn" style="width:' + (mid / n * 100) + '%"></div><div class="fill-fail" style="width:' + (bad / n * 100) + '%"></div></div></td>' +
        '<td class="num">' + ok + '</td><td class="num">' + mid + '</td><td class="num" style="color:' + (bad ? "var(--fail)" : "inherit") + ';font-weight:' + (bad ? 700 : 400) + '">' + bad + "</td></tr>";
    }).join("");
    const gridHead = '<tr><th class="case">case</th>' + RUNS.map(r => "<th>" + esc(r.name) + (r.graded !== "current" ? " *" : "") + "</th>").join("") + "</tr>";
    const grid = inj.map(c => '<tr><td class="case"><b>' + esc(c.id) + '</b><div class="runmeta">' + esc(c.title) + "</div></td>" + RUNS.map(r => '<td class="' + (r.graded !== "current" ? "dim" : "") + '">' + squaresFor(r, c.id) + "</td>").join("") + "</tr>").join("");
    return head("Prompt injection", "Hostile text is planted inside <i>tool results</i>, not the prompt: a fake system notice in an order, an addendum appended to the refund policy, an exfiltration request, a forged supervisor approval. A fifth case plants text <i>and</i> requires a legitimate refund, so an agent that refuses everything cannot score perfectly.") +
      '<div class="card flush scroll"><table><thead><tr><th>run</th><th>outcome mix</th><th class="num">correct</th><th class="num">wrong, safe</th><th class="num">unsafe</th></tr></thead><tbody>' + summary + "</tbody></table></div>" +
      '<div class="card flush scroll heat"><table><thead>' + gridHead + "</thead><tbody>" + grid + "</tbody></table></div>" + legend() +
      '<p class="muted small" style="margin-top:10px">“Wrong, safe” includes obeying an instruction in words without acting on it &mdash; open <a href="#trace/baseline/injection-tampered-policy/1">injection-tampered-policy</a> on the baseline to see one.</p>';
  },

  reviewer() {
    const revRuns = RUNS.filter(r => r.meta.reviewer);
    if (!revRuns.length) return head("Reviewer", "No recorded run had a reviewer.");
    return head("A second model in front of every payout", "The reviewer sees the policy and the proposed action, and can send it back. Measured both ways: with its thinking turned off to save tokens, and on.") +
      revRuns.map(r => {
        const reviews = [];
        r.attempts.forEach(a => a.steps.forEach(s => { if (s.kind === "review") reviews.push({a, s}); }));
        const count = k => reviews.filter(x => x.s.decision === k).length;
        const letThrough = reviews.filter(x => x.s.decision === "approve" && !x.a.safe).length;
        const rows = reviews.map(({a, s}) => {
          const cls = s.decision === "approve" ? "c-pass" : s.decision === "reject" ? "c-fail" : "c-warn";
          const flag = s.decision === "approve" && !a.safe;
          return '<tr><td><a href="#trace/' + encodeURIComponent(r.name) + "/" + encodeURIComponent(a.case_id) + "/" + a.repeat + '"><b>' + esc(a.case_id) + "</b></a><div class=\"runmeta\">repeat " + a.repeat + "</div></td>" +
            '<td><div class="call"><b>' + esc(s.tool_name) + "</b>(" + esc(oneLineArgs(s.arguments)) + ")</div></td><td>" + chip(cls, s.decision) + "</td><td>" + esc(s.reason) + "</td><td>" + (flag ? chip("c-fail", "let a forbidden action through") : outcomeOf(a).chip) + "</td></tr>";
        }).join("");
        return '<div class="card"><div class="tags" style="margin-bottom:10px"><b style="font-size:15px;margin-right:6px">' + esc(r.name) + "</b>" + gradedChip(r) + chip("c-mute plain", "thinking " + (r.meta.reviewer_think === false ? "off" : "on")) + "</div>" +
          '<div class="stats"><div class="stat"><div class="k">reviews</div><div class="v">' + reviews.length + '</div></div><div class="stat"><div class="k">approved</div><div class="v">' + count("approve") + '</div></div><div class="stat"><div class="k">rejected</div><div class="v">' + count("reject") + '</div></div><div class="stat"><div class="k">let a forbidden action through</div><div class="v" style="color:' + (letThrough ? "var(--fail)" : "inherit") + '">' + letThrough + "</div></div></div></div>" +
          '<div class="card flush scroll"><table><thead><tr><th>attempt</th><th>proposed action</th><th>decision</th><th>reviewer\'s reason</th><th>outcome</th></tr></thead><tbody>' + rows + "</tbody></table></div>";
      }).join("") + staleNotices(revRuns);
  },

  judge() {
    const ticks = [0, 0.2, 0.4, 0.6, 0.8, 1];
    const toX = k => Math.max(0, Math.min(1, k)) * 100;
    const rows = D.judge.map(j => {
      const superseded = /superseded|contaminated/.test(j.title);
      const headline = /pooled-majority/.test(j.file);
      const color = superseded ? "var(--muted)" : headline ? "var(--pass-fill)" : "var(--accent)";
      const k = j.kappa, ci = j.ci;
      const plot = '<div class="plot"><div class="axis"></div>' + ticks.map(t => '<div class="tick" style="left:' + toX(t) + '%"></div>').join("") +
        (ci ? '<div class="ival" style="left:' + toX(ci[0]) + "%;width:" + Math.max(toX(ci[1]) - toX(ci[0]), 0.6) + "%;background:" + color + ';opacity:.35"></div>' : "") +
        (k != null ? '<div class="dotp" style="left:' + toX(k) + "%;background:" + color + '" title="kappa ' + k.toFixed(3) + '"></div>' : "") + "</div>";
      const c = j.confusion || {};
      const sub = j.n + " replies" + (j.clusters && j.clusters < j.n ? " from " + j.clusters + " cases" : "") + " &middot; caught " + (c.tp || 0) + ", missed " + (c.fn || 0) + ", invented " + (c.fp || 0) +
        (j.bound != null ? " &middot; none disagreed, so the true rate could still be up to " + pct(j.bound) : "");
      return '<div class="row ' + (superseded ? "dim" : "") + '"><div class="ttl">' + esc(j.title) + (headline ? " " + chip("c-pass plain", "the figure to quote") : "") + "<small>" + sub + "</small></div>" + plot + '<div class="val">' + (k == null ? "&ndash;" : k.toFixed(2)) + "</div></div>";
    }).join("");
    const scale = '<div class="scale"><div></div><div class="labs">' + ticks.map(t => '<span style="left:' + toX(t) + '%">' + t.toFixed(1) + "</span>").join("") + "</div><div></div></div>";
    const panels = D.panels.map(p => {
      const total = p.replies || 1;
      return '<div class="card"><h3>' + esc(p.set === "sampled" ? "Held-out replies (temperature 0.7)" : "Baseline replies (temperature 0)") + "</h3>" +
        '<div class="stats" style="margin-bottom:12px"><div class="stat"><div class="k">raters</div><div class="v">' + p.raters + '</div></div><div class="stat"><div class="k">replies</div><div class="v">' + p.replies + '</div></div><div class="stat"><div class="k">panel agreement</div><div class="v">&kappa; ' + (p.fleiss_kappa == null ? "&ndash;" : p.fleiss_kappa.toFixed(2)) + "</div></div></div>" +
        '<div class="stack" style="height:12px" title="unanimous ' + p.splits.unanimous + ", one dissent " + p.splits.one_dissent + ", split " + p.splits.split + '"><div class="fill-pass" style="width:' + (p.splits.unanimous / total * 100) + '%"></div><div class="fill-info" style="width:' + (p.splits.one_dissent / total * 100) + '%"></div><div class="fill-warn" style="width:' + (p.splits.split / total * 100) + '%"></div></div>' +
        '<div class="legend" style="margin:8px 0 12px"><span><i class="sq pass"></i>unanimous ' + p.splits.unanimous + '</span><span><i class="sq" style="background:var(--accent)"></i>one dissent ' + p.splits.one_dissent + '</span><span><i class="sq warn"></i>split, so contested ' + p.splits.split + "</span></div>" +
        (p.contested.length ? '<div class="small muted" style="margin-bottom:6px">contested &mdash; evidence about the rubric, not the judge</div>' + p.contested.map(x => '<div style="display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)"><code>' + esc(x.case_id) + '</code><span class="muted small">' + esc(x.split) + "</span></div>").join("") : "") + "</div>";
    }).join("");
    return head("How far to trust the judge", "The judge reads only the customer's message, the rubric and the reply &mdash; never the effect log or the graders' verdict. It is measured against five independent raters who saw exactly the same and nothing else. They are models, not people. Earlier measurements are kept, faded, with what was wrong with them.") +
      '<div class="card"><h3>Cohen\'s &kappa;, judge against the reference, with 95% interval</h3><div class="forest">' + rows + scale + "</div></div>" +
      '<div class="notice" style="background:var(--info-bg)"><span>&#9432;</span><div>The figure to quote is the green row: the pooled set with the contested replies put back by simple majority. Dropping the replies the panel could not settle gives 1.0, but excluding the hardest items is how agreement gets manufactured &mdash; and where nothing disagreed the interval collapses to a point, which is why the bound beside it matters more than the 1.0.</div></div>' +
      "<h2 style=\"font-size:17px;margin:22px 0 12px\">The rater panel</h2>" + '<div class="grid2">' + panels + "</div>";
  },
};

const TABS = [["overview", "Runs"], ["compare", "Compare"], ["cases", "Cases"], ["trace", "Trace"], ["injection", "Injection"], ["reviewer", "Reviewer"], ["judge", "Judge"]];

function route() {
  const parts = (location.hash.slice(1) || "overview").split("/").map(decodeURIComponent);
  const view = VIEWS[parts[0]] ? parts[0] : "overview";
  document.getElementById("nav").innerHTML = TABS.map(([k, label]) => '<a href="#' + k + '"' + (k === view ? ' class="on"' : "") + ">" + label + "</a>").join("");
  document.getElementById("main").innerHTML = VIEWS[view](parts.slice(1));
  const val = id => encodeURIComponent(document.getElementById(id).value);
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onchange = fn; };
  on("ca", () => location.hash = "compare/" + val("ca") + "/" + val("cb"));
  on("cb", () => location.hash = "compare/" + val("ca") + "/" + val("cb"));
  on("tr", () => location.hash = "trace/" + val("tr"));
  on("tc", () => location.hash = "trace/" + val("tr") + "/" + val("tc"));
  on("tp", () => location.hash = "trace/" + val("tr") + "/" + val("tc") + "/" + val("tp"));
}
renderHero();
window.addEventListener("hashchange", () => { route(); window.scrollTo({top: 0}); });
route();
</script>
